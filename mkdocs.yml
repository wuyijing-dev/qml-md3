# Local preview only. Canonical MkDocs + GitHub Pages live in:
#   https://github.com/wuyijing-dev/QML_MD3_Document
# Sync is manual: workflow_dispatch or
#   python tools/sync_document_repo.py --push

site_name: QML MD3
site_description: Material Design 3 component library for Qt Quick / QML
site_url: https://wuyijing-dev.github.io/QML_MD3_Document/
repo_url: https://github.com/wuyijing-dev/QML_MD3
repo_name: wuyijing-dev/QML_MD3

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 许可与认证: licensing.md
  - 入门:
    - 快速开始: getting-started/quickstart.md
    - 集成: getting-started/integration.md
    - 打包: getting-started/packaging.md
    - API 稳定性: getting-started/api-stability.md
    - 发版清单: getting-started/release-checklist.md
  - 设计与模式:
    - 设计指南: guides/design-guidelines.md
    - 按钮与命令: guides/buttons-commands.md
    - 集合与列表: guides/collections.md
    - 布局: guides/layout.md
    - 反馈层级: guides/feedback.md
    - 少写胶水: guides/glue-less-api.md
    - 模块边界: guides/module-boundaries.md
    - 令牌: guides/tokens.md
  - 专题:
    - 性能: topics/performance.md
    - 无障碍: topics/a11y.md
    - 无障碍抽检: topics/a11y-spotcheck.md
    - 国际化: topics/i18n.md
    - DataTable: topics/datatable.md
    - Qt 版本矩阵: topics/qt-version-matrix.md
    - 实验性 API: topics/experimental.md
    - 文档托管: topics/mkdocs-hosting.md
  - API 索引: api/README.md
  - 维护:
    - 生产 TODO: project/professional-todo.md
