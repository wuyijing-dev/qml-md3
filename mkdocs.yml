# Local preview only. Canonical MkDocs + GitHub Pages live in:
#   https://github.com/wuyijing-dev/QML_MD3_Document
# Sync is manual: workflow_dispatch or
#   python scripts/docs/sync_document_repo.py --push

site_name: QML MD3
site_description: Material Design 3 component library for Qt Quick / QML
site_url: https://wuyijing-dev.github.io/QML_MD3_Document/
repo_url: https://github.com/wuyijing-dev/QML_MD3
repo_name: wuyijing-dev/QML_MD3

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 集成: integration.md
  - 打包: packaging.md
  - API 稳定性: api-stability.md
  - 发版清单: release-checklist.md
  - 生产 TODO: professional-todo.md
  - 设计与模式:
    - 设计指南: design-guidelines.md
    - 按钮与命令: buttons-commands.md
    - 集合与列表: collections.md
    - 布局: layout.md
    - 反馈层级: feedback.md
    - 模块边界: module-boundaries.md
  - 专题:
    - 性能: performance.md
    - 无障碍: a11y.md
    - 无障碍抽检: a11y-spotcheck.md
    - 国际化: i18n.md
    - DataTable: datatable.md
    - Qt 版本矩阵: qt-version-matrix.md
    - 实验性 API: experimental.md
    - 文档托管: mkdocs-hosting.md
  - API 索引: api/README.md
