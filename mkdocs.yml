# Local preview only. Canonical MkDocs + GitHub Pages live in:
#   https://github.com/wuyijing-dev/QML_MD3_Document
# Sync is manual: workflow_dispatch or
#   python tools/sync_document_repo.py --push

site_name: QML MD3
site_description: Material Design 3 component library for Qt Quick / QML
site_url: https://wuyijing-dev.github.io/QML_MD3_Document/
repo_url: https://github.com/wuyijing-dev/qml-md3
repo_name: wuyijing-dev/qml-md3

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

