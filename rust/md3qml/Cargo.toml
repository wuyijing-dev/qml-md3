[package]
name = "md3qml"
version = "1.1.4"
edition = "2021"
description = "Rust host for the shared Md3 QML module (C ABI)"
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/wuyijing-dev/qml-md3"
homepage = "https://github.com/wuyijing-dev/qml-md3"
documentation = "https://github.com/wuyijing-dev/qml-md3/blob/main/docs/topics/rust.md"
keywords = ["qml", "qt", "material-design", "md3"]
categories = ["gui"]

[lib]
name = "md3qml"
path = "src/lib.rs"

[dependencies]
libloading = "0.8"
