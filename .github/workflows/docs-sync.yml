name: docs-sync

# Manual sync only — do not push Document repo on every docs/api regen.
# Requires repository secret DOCUMENT_SYNC_TOKEN (PAT with Contents:write on Document).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sync token
        id: token
        run: |
          if [ -z "${{ secrets.DOCUMENT_SYNC_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::DOCUMENT_SYNC_TOKEN not set"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone document repo
        env:
          DOCUMENT_SYNC_TOKEN: ${{ secrets.DOCUMENT_SYNC_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${DOCUMENT_SYNC_TOKEN}@github.com/wuyijing-dev/QML_MD3_Document.git" \
            "$HOME/QML_MD3_Document"

      - name: Sync docs and push
        env:
          DOCUMENT_SYNC_TOKEN: ${{ secrets.DOCUMENT_SYNC_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/sync_document_repo.py \
            --dest "$HOME/QML_MD3_Document" \
            --push \
            --message "Sync docs from QML_MD3@${GITHUB_SHA:0:7}"
