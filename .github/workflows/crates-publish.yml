name: crates-publish

# Publish rust/md3qml to crates.io when CARGO_REGISTRY_TOKEN is set.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/md3qml
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret not set — skip crates.io"
            exit 0
          fi
          cargo publish --allow-dirty
