[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md3qml"
version = "1.0.0"
description = "Bootstrap the QML_MD3 shared module from PySide6 / PySide2"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "QML_MD3" }]
dependencies = []
optional-dependencies = { pyside6 = ["PySide6>=6.5"], pyside2 = ["PySide2>=5.15"] }

[project.urls]
Repository = "https://github.com/wuyijing-dev/QML_MD3"

[tool.setuptools.packages.find]
where = ["."]
include = ["md3qml*"]
