[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md3qml"
version = "1.1.1"
description = "Run the QML_MD3 shared module from PySide6"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "QML_MD3" }]
keywords = ["qml", "qt", "pyside6", "material-design", "md3"]
dependencies = []
optional-dependencies = { pyside6 = ["PySide6>=6.5"] }

[project.urls]
Homepage = "https://github.com/wuyijing-dev/qml-md3"
Documentation = "https://github.com/wuyijing-dev/qml-md3/blob/main/docs/topics/pyside.md"
Repository = "https://github.com/wuyijing-dev/qml-md3"
Issues = "https://github.com/wuyijing-dev/qml-md3/issues"

[project.scripts]
md3qml = "md3qml.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["md3qml*"]

[tool.setuptools.package-data]
md3qml = ["py.typed", "_native/.gitkeep", "_native/**/*"]
